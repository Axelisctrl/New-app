<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClearReply AI | One-Click Email Responses</title>

  <meta name="description"
    content="Help organizations respond to routine emails with one-click options.">

  <style>
    :root {
      --blue: #4968f5;
      --dark: #172033;
      --muted: #69758a;
      --border: #e3e8f0;
      --bg: #f6f8fc;
      --green: #16865b;
      --red: #c54848;
      --orange: #a96b13;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      color: var(--dark);
      background: white;
      line-height: 1.6;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .brand-icon {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--blue);
      border-radius: 12px;
    }

    .nav-link {
      font-size: 14px;
      color: var(--muted);
    }

    .hero {
      padding: 94px 0 82px;
      background:
        radial-gradient(circle at 85% 15%, #e8edff 0, transparent 33%),
        linear-gradient(180deg, #fbfcff, #ffffff);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      align-items: center;
      gap: 65px;
    }

    .eyebrow {
      display: inline-block;
      color: var(--blue);
      background: #edf0ff;
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    h1 {
      margin: 22px 0 18px;
      font-size: clamp(37px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: -2.7px;
    }

    .hero-description {
      color: var(--muted);
      font-size: 17px;
      max-width: 540px;
      line-height: 1.8;
    }

    .primary-link {
      display: inline-block;
      margin-top: 24px;
      background: var(--blue);
      color: white;
      padding: 13px 21px;
      border-radius: 10px;
      font-weight: 750;
      font-size: 14px;
      box-shadow: 0 7px 18px #4968f52b;
    }

    .primary-link:hover {
      background: #3553de;
    }

    .hero-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 15px;
    }

    .demo-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 25px 70px #27365b15;
    }

    .demo-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--border);
    }

    .demo-logo {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #edf0ff;
      color: var(--blue);
      font-weight: 900;
    }

    .demo-top small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .demo-content {
      padding: 23px;
    }

    .tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .email-subject {
      font-weight: 800;
      margin: 5px 0 18px;
      font-size: 17px;
    }

    .email-box {
      background: #f7f8fc;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 16px;
      color: #49546a;
      font-size: 13px;
      line-height: 1.8;
    }

    .decision-title {
      font-size: 13px;
      font-weight: 800;
      margin: 22px 0 11px;
    }

    .decision {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      text-align: left;
      margin-top: 8px;
      color: var(--dark);
      transition: 0.15s;
    }

    .decision:hover,
    .decision.selected {
      border-color: var(--blue);
      background: #f3f5ff;
    }

    .decision-icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 17px;
    }

    .agree .decision-icon {
      background: #e6f7ef;
      color: var(--green);
    }

    .disagree .decision-icon {
      background: #fff0f0;
      color: var(--red);
    }

    .more .decision-icon {
      background: #fff5e4;
      color: var(--orange);
    }

    .decision strong {
      display: block;
      font-size: 13px;
    }

    .decision small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .reply {
      display: none;
      margin-top: 17px;
      padding: 15px;
      border: 1px solid #dce4ff;
      border-radius: 11px;
      background: #f9faff;
    }

    .reply.visible {
      display: block;
    }

    .reply strong {
      font-size: 13px;
    }

    .reply p {
      color: #49546a;
      font-size: 12px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .demo-disclaimer {
      font-size: 10px;
      color: var(--muted);
      margin-top: 12px;
    }

    section {
      padding: 76px 0;
    }

    .section-heading {
      max-width: 680px;
      margin: 0 auto 38px;
      text-align: center;
    }

    .section-heading h2 {
      font-size: clamp(27px, 4vw, 38px);
      line-height: 1.2;
      letter-spacing: -1.2px;
      margin: 0 0 13px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 15px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 21px;
    }

    .step {
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: white;
    }

    .step-number {
      width: 40px;
      height: 40
