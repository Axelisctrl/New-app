<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearReply AI — Organization Inbox</title>
<meta name="description" content="Help organizations respond to routine emails with one-click options.">

<style>
:root {
  --blue: #4263eb;
  --blue-soft: #edf1ff;
  --ink: #202a3b;
  --muted: #778195;
  --border: #e5e9f0;
  --bg: #f5f7fb;
  --green: #16865b;
  --red: #c64747;
  --orange: #a86c12;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }

.topbar {
  height: 70px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -.6px;
}

.logo {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: white;
  background: var(--blue);
  font-size: 19px;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.demo-badge {
  color: #4059d7;
  background: var(--blue-soft);
  padding: 7px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #e8edff;
  color: #4156b8;
  display: grid;
  place-items: center;
  font-weight: 800;
}

.layout {
  max-width: 1500px;
  margin: auto;
  padding: 22px;
  min-height: calc(100vh - 70px);
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 20px;
}

.inbox, .workspace {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  min-width: 0;
  overflow: hidden;
}

.inbox {
  align-self: start;
}

.inbox-heading {
  padding: 22px 19px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.inbox-heading h2 {
  margin: 0;
  font-size: 17px;
}

.count {
  color: var(--muted);
  font-size: 11px;
}

.search-box {
  padding: 0 15px 17px;
}

.search-box input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  outline: none;
  background: #fafbfe;
  font-size: 12px;
}

.search-box input:focus,
textarea:focus {
  border-color: var(--blue);
}

.list-label {
  padding: 13px 18px 9px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  border-top: 1px solid var(--border);
}

.email-item {
  padding: 15px 15px 14px;
  width: 100%;
  border: 0;
  border-top: 1px solid #edf0f5;
  border-left: 3px solid transparent;
  background: white;
  text-align: left;
  color: var(--ink);
}

.email-item:hover { background: #f8f9ff; }

.email-item.active {
  background: #eff3ff;
  border-left-color: var(--blue);
}

.email-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.sender {
  font-size: 12px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.time {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.subject {
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
  margin-top: 8px;
}

.snippet {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  margin-top: 5px;
}

.pill {
  display: inline-block;
  padding: 4px 7px;
  border-radius: 20px;
  margin-top: 9px;
  font-size: 10px;
  font-weight: 800;
  background: #eef1f6;
  color: #667186;
}

.pill.agreed { background: #e7f7ee; color: var(--green); }
.pill.disagreed { background: #fff0f0; color: var(--red); }
.pill.more { background: #fff4df; color: var(--orange); }

.workspace {
  display: flex;
  flex-direction: column;
}

.workspace-heading {
  padding: 20px 23px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.workspace-heading h1 {
  font-size: 19px;
  margin: 0;
}

.workspace-heading p {
  margin: 5px 0 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.incoming-label {
  background: #eef1f7;
  color: #647087;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.message-content {
  padding: 23px;
}

.message-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.person-avatar {
  height: 44px;
  width: 44px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: #4359ad;
  background: #edf0ff;
  font-size: 13px;
  font-weight: 800;
}

.person-info {
  min-width: 0;
  flex: 1;
}

.person-name {
  font-size: 13px;
  font-weight: 800;
}

.person-email {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
  overflow-wrap: anywhere;
}

.message-date {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.field-label {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 800;
  letter-spacing: .8px;
  margin-top: 22px;
}

.message-subject {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.4;
  margin-top: 5px;
  letter-spacing: -.5px;
}

.email-body {
  color: #465268;
  line-height: 1.9;
  font-size: 13px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 20px;
}

.thread-reply {
  border-top: 1px solid var(--border);
  margin-top: 22px;
  padding-top: 20px;
}

.reply-thread-heading {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.reply-thread-heading strong { font-size: 12px; }
