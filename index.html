<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>ClearReply — One-click organization responses</title>
<meta name="description" content="Help organizations respond to routine emails with one-click options.">

<style>
:root {
  --ink: #172033;
  --muted: #768196;
  --line: #e7ebf2;
  --bg: #f4f6fa;
  --white: #fff;
  --navy: #121b2b;
  --navy2: #1c2940;
  --blue: #4f68ee;
  --blue2: #eef1ff;
  --green: #16784d;
  --greenbg: #e8f8ee;
  --red: #b63b48;
  --redbg: #fff0f1;
  --amber: #92620d;
  --amberbg: #fff6df;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
}

button, input { font: inherit; }
button { cursor: pointer; }

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 205px 280px minmax(300px, 1fr) 285px;
  background: var(--white);
}

/* Sidebar */
.sidebar {
  background: var(--navy);
  color: #dfe6f2;
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  font-size: 18px;
  font-weight: 800;
  padding: 0 5px 30px;
}

.logo {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: linear-gradient(135deg, #7890ff, #455fe8);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 19px;
}

.brand small {
  display: block;
  color: #94a5ff;
  font-size: 9px;
  letter-spacing: 1.2px;
}

.primary-nav, .nav-link {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 12px;
  text-align: left;
  font-weight: 700;
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 5px;
}

.primary-nav {
  background: white;
  color: var(--navy);
  margin-bottom: 25px;
}

.nav-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.3px;
  color: #7f8da5;
  padding: 0 10px 8px;
}

.nav-link {
  background: transparent;
  color: #afbdd2;
  font-size: 12px;
}

.nav-link.active, .nav-link:hover {
  background: #26364f;
  color: white;
}

.nav-count {
  margin-left: auto;
  font-size: 11px;
}

.side-bottom {
  margin-top: auto;
  border-top: 1px solid #2b3850;
  padding: 17px 6px 0;
  color: #8c9bb2;
  font-size: 11px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
  color: white;
  font-weight: 700;
}

.avatar {
  height: 34px;
  width: 34px;
  border-radius: 10px;
  background: #e3e9ff;
  color: #4058c6;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 11px;
  flex-shrink: 0;
}

.tiny {
  font-size: 10px;
  color: #95a4bc;
  font-weight: 500;
}

/* Inbox */
.inbox {
  border-right: 1px solid var(--line);
  background: #fbfcfe;
  min-width: 0;
}

.inbox-head {
  height: 76px;
  border-bottom: 1px solid var(--line);
  padding: 0 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.inbox-head h2 {
  font-size: 19px;
  margin: 0;
}

.muted {
  color: var(--muted);
  font-size: 11px;
}

.search-wrap {
  padding: 14px 12px 10px;
}

.search {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: white;
  outline: none;
  font-size: 12px;
}

.search:focus {
  border-color: #aab7ff;
  box-shadow: 0 0 0 3px #edf0ff;
}

.filters {
  display: flex;
  gap: 5px;
  padding: 2px 12px 11px;
  flex-wrap: wrap;
}

.filter {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 8px;
  background: white;
  color: #758198;
  font-size: 10px;
  font-weight: 750;
}

.filter.active {
  border-color: #dce2ff;
  color: var(--blue);
  background: #f2f4ff;
}

.mail-row {
  display: flex;
  gap: 9px;
  padding: 14px 12px;
  border-top: 1px solid #eef1f5;
  border-left: 3px solid transparent;
  cursor: pointer;
}

.mail-row:hover { background: #f6f7fc; }

.mail-row.active {
  background: #eef1ff;
  border-left-color: var(--blue);
}

.mail-detail { min-width: 0; flex: 1; }

.row-top {
  display: flex;
  align-items: center;
  gap: 5px;
}

.row-name {
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.row-time {
  color: #9aa4b3;
  font-size: 10px;
  white-space: nowrap;
}

.row-subject {
  font-size: 12px;
  font-weight: 750;
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row-preview {
  font-size: 11px;
  color: #8994a6;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mini-status {
  display: inline-flex;
  font-size: 9px;
  font-weight: 800;
  padding: 3px 6px;
  border-radius: 100px;
  margin-top: 7px;
}

.s-wait { color: #6c7890; background: #eef1f6; }
.s-sent { color: var(--green); background: var(--greenbg); }

/* Conversation */
.conversation {
  min-width: 0;
  background: white;
}

.topbar {
  min-height: 76px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 18px;
}

.breadcrumb {
  font-size: 10px;
  color: #9ca6b5;
  margin-bottom: 3px;
}

.topbar h1 {
  margin: 0;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.outline-btn {
  border: 1px solid var(--line);
  background: white;
  color: #637087;
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 11px;
  font-weight: 750;
}

.outline-btn:hover {
  background: #f7f8ff;
  border-color: #cbd4ff;
  color: var(--blue);
}

.mail-content {
  max-width: 850px;
  margin: 0 auto;
  padding: 24px 21px;
}

.subject-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #9aa5b4;
  font-weight: 850;
  margin-bottom: 7px;
}

.subject {
  font-size: 22px;
  line-height: 1.3;
  margin: 0 0 20px;
  letter-spacing: -.6px;
  overflow-wrap: anywhere;
}

.sender-line {
  display: flex;
  gap: 11px;
  align-items: center;
  padding-bottom: 17px;
}

.sender-info { flex: 1; min-width: 0; }

.sender-name {
  font-size: 12px;
  font-weight: 800;
}

.sender-email {
  font-size: 10px;
  color: #929daf;
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.date {
  font-size: 10px;
  color: #9ca7b6;
  white-space: nowrap;
}

.email-body {
  border: 1px solid var(--line);
  border-radius: 13px;
  overflow: hidden;
}

.body-copy {
  padding: 19px;
  color: #536077;
  font-size: 13px;
  line-height: 1.9;
}

.body-copy p { margin: 0 0 13px; }
.body-copy p:last-child { margin-bottom: 0; }

.attachment {
  padding: 12px 15px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  color: #778399;
  font-size: 11px;
  background: #fcfdff;
}

.file-icon {
  width: 31px;
  height: 35px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: #fff0f0;
  color: #ca5151;
  font-size: 10px;
  font-weight: 900;
}

.thread-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #9ca6b4;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1px;
  margin: 23px 0 14px;
}

.thread-divider:before, .thread-divider:after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}

.reply-message {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px;
  background: #fbfcff;
  display: none;
}

.reply-message.show { display: block; }

.reply-heading {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 9px;
}

.reply-message p {
  color: #59667b;
  font-size: 12px;
  line-height: 1.8;
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.info-banner {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  border: 1px solid #e3e8fb;
  background: #f7f8ff;
  color: #61708a;
  border-radius: 10px;
  padding: 12px;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 20px;
}

.info-banner strong { color: #3e51bd; }

/* Response panel */
.action-panel {
  border-left: 1px solid var(--line);
  background: #fbfcfe;
  min-width: 0;
}

.panel-head {
  min-height: 76px;
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.ai-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: #edf0ff;
  color: #4d64ee;
  display: grid;
  place-items: center;
  font-weight: 900;
}

.panel-head h2 {
  font-size: 14px;
  margin: 0;
}

.panel-head .sub {
  color: #99a4b4;
  font-size: 10px;
  margin-top: 2px;
}

.panel-content { padding: 19px 15px; }

.small-label {
  font-size: 10px;
  letter-spacing: 1.1px;
  font-weight: 850;
